<div class="auth-container">
    <div class="auth-box">
        <h2>Welcome Back!!</h2>
        <p class="subtitle">Please login to your account</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
    <input type="text" formControlName="email" placeholder="email" required>
</div>
<div class="form-group">
    <input type="password" formControlName="password" placeholder="password" required>
</div>
    <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">Login</button>
</form>
<p class='footer-text'>
    Don't have an account? <a routerLink="/register">Register here!</a>
</p>
</div>

    
</div>
