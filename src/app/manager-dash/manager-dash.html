<h1>Manager Dashboard</h1>
<h2>New Users List</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Employee ID</th>
        <th>Assign Role</th>
    </tr>

    <tr *ngFor="let user of users">
        <td>{{user.name}}</td>
        <td>{{user.email}}</td>
        <td>{{user.id}}</td>
        <td>
            <!-- pass Mongo _id and send lowercase role -->
            <button (click)="assignRole(user._id, 'mentor')">Mentor</button>
            <button (click)="assignRole(user._id, 'mentee')">Mentee</button>
        </td>
    </tr>
</table>
